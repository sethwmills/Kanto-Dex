<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kanto Dex Tracker</title>

<!-- iOS "add to home screen" as a standalone app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kanto Dex" />
<meta name="theme-color" content="#211f1a" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Kanto Dex Tracker","short_name":"Kanto Dex","display":"standalone","background_color":"%23efece2","theme_color":"%23211f1a","start_url":"."}' />

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap');

*{ -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; background:#efece2; }

.kd-root{
  --ink:#211f1a; --dim:#6f6a5c; --paper:#efece2; --card:#fbfaf5;
  --line:#dcd7c8; --red:#c1272d; --have:#1f8a5b; --want:#b7791f;
  max-width:560px; margin:0 auto; background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh;
}
.kd-head{ position:sticky; top:0; z-index:5; background:var(--paper);
  padding:max(18px, env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--line); }
.kd-brand{ display:flex; align-items:center; gap:12px; }
.kd-lens{ width:26px; height:26px; border-radius:50%; flex:0 0 auto;
  background:radial-gradient(circle at 32% 30%, #7ec8ff 0 22%, var(--red) 60% 100%);
  box-shadow:0 0 0 3px #fff, 0 0 0 4px var(--ink); }
.kd-kicker{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.18em; font-size:10px; color:var(--red); }
.kd-title{ font-family:'Oswald',sans-serif; font-weight:700; font-size:20px;
  line-height:1.05; margin:2px 0 0; letter-spacing:.01em; }

.kd-screen{ margin-top:14px; background:var(--ink); border-radius:10px; padding:12px 14px; color:#f2efe6; }
.kd-readout{ display:flex; align-items:baseline; gap:6px; font-family:'Space Mono',monospace; }
.kd-count{ font-size:30px; font-weight:700; color:#8be0b6; letter-spacing:.02em; }
.kd-slash{ font-size:18px; color:#6f6a5c; }
.kd-total{ font-size:18px; color:#b9b3a4; }
.kd-pct{ margin-left:auto; font-size:14px; font-weight:700; color:#f2efe6; }
.kd-bar{ margin-top:9px; height:8px; border-radius:5px; background:#3a372f; overflow:hidden; }
.kd-fill{ height:100%; background:linear-gradient(90deg,#1f8a5b,#8be0b6); border-radius:5px; transition:width .35s ease; }
.kd-sub{ margin-top:7px; font-family:'Space Mono',monospace; font-size:11px; color:#b9b3a4; }

.kd-search{ width:100%; margin-top:12px; padding:10px 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--ink); font-size:16px; box-sizing:border-box; }
.kd-search:focus{ outline:2px solid var(--red); outline-offset:1px; }

.kd-tabs{ display:flex; gap:6px; margin-top:12px; }
.kd-tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:7px 4px; border:1px solid var(--line); border-radius:8px; background:var(--card);
  font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
  font-size:11px; color:var(--dim); cursor:pointer; }
.kd-tab.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.kd-tabnum{ font-family:'Space Mono',monospace; font-size:13px; font-weight:700; letter-spacing:0; }

.kd-warn{ margin:10px 12px 0; padding:9px 12px; border:1px solid var(--want); border-radius:8px;
  background:#fbf3e2; color:#8a5a12; font-size:12px; line-height:1.35; }

.kd-export{ padding:10px 12px 0; }
.kd-exportbtn{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
  font-size:10px; color:var(--dim); background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:6px 12px; cursor:pointer; }
.kd-exportpanel{ margin-top:8px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
.kd-exporthint{ font-family:'Space Mono',monospace; font-size:11px; color:var(--dim); margin-bottom:8px; }
.kd-exportbox{ width:100%; height:70px; box-sizing:border-box; resize:vertical;
  font-family:'Space Mono',monospace; font-size:12px; color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:6px; padding:8px; }
.kd-copybtn{ margin-top:8px; font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.08em; font-size:11px; color:#fff; background:var(--ink); border:0;
  border-radius:8px; padding:8px 14px; cursor:pointer; }

.kd-body{ padding:6px 12px 20px; }
.kd-sec{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.16em;
  font-size:11px; color:var(--dim); margin:16px 4px 8px; }
.kd-list{ list-style:none; margin:0; padding:0; }
.kd-row{ border-bottom:1px solid var(--line); }
.kd-rowbtn{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 8px;
  background:none; border:0; text-align:left; cursor:pointer; color:var(--ink); }
.kd-rowbtn:focus-visible{ outline:2px solid var(--red); outline-offset:-2px; border-radius:6px; }
.kd-check{ width:22px; height:22px; flex:0 0 auto; border:2px solid var(--line); border-radius:6px;
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; background:var(--card); }
.kd-check.on{ background:var(--have); border-color:var(--have); }
.kd-dex{ font-family:'Space Mono',monospace; font-size:12px; color:var(--dim); width:36px; flex:0 0 auto; }
.kd-name{ font-size:15px; font-weight:500; }
.kd-row.have .kd-name{ color:var(--dim); }
.kd-want{ margin-left:auto; font-family:'Oswald',sans-serif; font-size:10px; font-weight:600;
  text-transform:uppercase; letter-spacing:.1em; color:var(--want); border:1px solid var(--want);
  padding:2px 7px; border-radius:20px; flex:0 0 auto; }

.kd-empty{ padding:40px 16px; text-align:center; color:var(--dim); font-size:14px; }
.kd-foot{ padding:14px 16px calc(28px + env(safe-area-inset-bottom)); text-align:center;
  font-family:'Space Mono',monospace; font-size:11px; color:var(--dim); border-top:1px solid var(--line); }

@media (prefers-reduced-motion: reduce){ .kd-fill{ transition:none; } }
</style>
</head>
<body>
<div class="kd-root">
  <header class="kd-head">
    <div class="kd-brand">
      <span class="kd-lens" aria-hidden="true"></span>
      <div>
        <div class="kd-kicker">Card Completion Log</div>
        <h1 class="kd-title">Kanto Dex 151 + Eeveelutions</h1>
      </div>
    </div>

    <div class="kd-screen">
      <div class="kd-readout">
        <span class="kd-count" id="count">000</span>
        <span class="kd-slash">/</span>
        <span class="kd-total" id="total">0</span>
        <span class="kd-pct" id="pct">0%</span>
      </div>
      <div class="kd-bar"><div class="kd-fill" id="fill" style="width:0%"></div></div>
      <div class="kd-sub" id="sub"></div>
    </div>

    <input class="kd-search" id="search" placeholder="Search name or number" />

    <div class="kd-tabs" id="tabs"></div>
  </header>

  <div class="kd-warn" id="warn" style="display:none">
    Saving isn't working in this environment, so changes won't stick. On your phone's home-screen app it will.
  </div>

  <div class="kd-export">
    <button class="kd-exportbtn" id="exportToggle">Export owned list</button>
    <div class="kd-exportpanel" id="exportPanel" style="display:none">
      <div class="kd-exporthint" id="exportHint"></div>
      <textarea class="kd-exportbox" id="exportBox" readonly></textarea>
      <button class="kd-copybtn" id="copyBtn">Copy to clipboard</button>
    </div>
  </div>

  <main class="kd-body" id="body"></main>

  <footer class="kd-foot" id="foot">Tap a row to mark a card owned. Progress saves on this device.</footer>
</div>

<script>
/* ---------- Data ---------- */
var MAIN = [
  [1,"Bulbasaur"],[2,"Ivysaur"],[3,"Venusaur"],[4,"Charmander"],[5,"Charmeleon"],[6,"Charizard"],
  [7,"Squirtle"],[8,"Wartortle"],[9,"Blastoise"],[10,"Caterpie"],[11,"Metapod"],[12,"Butterfree"],
  [13,"Weedle"],[14,"Kakuna"],[15,"Beedrill"],[16,"Pidgey"],[17,"Pidgeotto"],[18,"Pidgeot"],
  [19,"Rattata"],[20,"Raticate"],[21,"Spearow"],[22,"Fearow"],[23,"Ekans"],[24,"Arbok"],
  [25,"Pikachu"],[26,"Raichu"],[27,"Sandshrew"],[28,"Sandslash"],[29,"Nidoran\u2640"],[30,"Nidorina"],
  [31,"Nidoqueen"],[32,"Nidoran\u2642"],[33,"Nidorino"],[34,"Nidoking"],[35,"Clefairy"],[36,"Clefable"],
  [37,"Vulpix"],[38,"Ninetales"],[39,"Jigglypuff"],[40,"Wigglytuff"],[41,"Zubat"],[42,"Golbat"],
  [43,"Oddish"],[44,"Gloom"],[45,"Vileplume"],[46,"Paras"],[47,"Parasect"],[48,"Venonat"],
  [49,"Venomoth"],[50,"Diglett"],[51,"Dugtrio"],[52,"Meowth"],[53,"Persian"],[54,"Psyduck"],
  [55,"Golduck"],[56,"Mankey"],[57,"Primeape"],[58,"Growlithe"],[59,"Arcanine"],[60,"Poliwag"],
  [61,"Poliwhirl"],[62,"Poliwrath"],[63,"Abra"],[64,"Kadabra"],[65,"Alakazam"],[66,"Machop"],
  [67,"Machoke"],[68,"Machamp"],[69,"Bellsprout"],[70,"Weepinbell"],[71,"Victreebel"],[72,"Tentacool"],
  [73,"Tentacruel"],[74,"Kanto Geodude"],[75,"Kanto Graveler"],[76,"Kanto Golem"],[77,"Ponyta"],[78,"Rapidash"],
  [79,"Slowpoke"],[80,"Slowbro"],[81,"Magnemite"],[82,"Magneton"],[83,"Farfetch'd"],[84,"Doduo"],
  [85,"Dodrio"],[86,"Seel"],[87,"Dewgong"],[88,"Grimer"],[89,"Muk"],[90,"Shellder"],
  [91,"Cloyster"],[92,"Gastly"],[93,"Haunter"],[94,"Gengar"],[95,"Onix"],[96,"Drowzee"],
  [97,"Hypno"],[98,"Krabby"],[99,"Kingler"],[100,"Voltorb"],[101,"Electrode"],[102,"Exeggcute"],
  [103,"Exeggutor"],[104,"Cubone"],[105,"Marowak"],[106,"Hitmonlee"],[107,"Hitmonchan"],[108,"Lickitung"],
  [109,"Koffing"],[110,"Weezing"],[111,"Rhyhorn"],[112,"Rhydon"],[113,"Chansey"],[114,"Tangela"],
  [115,"Kangaskhan"],[116,"Horsea"],[117,"Seadra"],[118,"Goldeen"],[119,"Seaking"],[120,"Staryu"],
  [121,"Starmie"],[122,"Mr. Mime"],[123,"Scyther"],[124,"Jynx"],[125,"Electabuzz"],[126,"Magmar"],
  [127,"Pinsir"],[128,"Tauros"],[129,"Magikarp"],[130,"Gyarados"],[131,"Lapras"],[132,"Ditto"],
  [133,"Eevee"],[134,"Vaporeon"],[135,"Jolteon"],[136,"Flareon"],[137,"Porygon"],[138,"Omanyte"],
  [139,"Omastar"],[140,"Kabuto"],[141,"Kabutops"],[142,"Aerodactyl"],[143,"Snorlax"],[144,"Articuno"],
  [145,"Zapdos"],[146,"Moltres"],[147,"Dratini"],[148,"Dragonair"],[149,"Dragonite"],[150,"Mewtwo"],[151,"Mew"]
];
var EEVEE = [[196,"Espeon"],[197,"Umbreon"],[470,"Leafeon"],[471,"Glaceon"],[700,"Sylveon"]];

// [uniqueKey, name, displayNumber] - key is synthetic so a form never collides with its base species.
var ALOLAN = [
  [10074,"Alolan Geodude",74],
  [10075,"Alolan Graveler",75],
  [10076,"Alolan Golem",76]
];
var TRAINER = [
  [20172,"Ethan's Pichu",172],
  [20155,"Ethan's Cyndaquil",155]
];

var DEFAULT_OWNED = new Set([
  1,2,4,5,25,26,37,38,45,54,58,59,62,65,73,77,78,79,80,94,107,120,124,127,128,
  129,130,131,133,134,135,137,142,143,146,147,148,
  10074,10075,10076,20172,20155
]);
var WANT = new Set([3,6,7,8,9,55,66,67,68,74,75,76,95,121,136,138,144,145,149,196]);

function mk(arr, group){ return arr.map(function(r){ return { dex:r[0], name:r[1], no:(r[2]!==undefined?r[2]:r[0]), group:group }; }); }
var GROUPS = [
  { key:"kanto",   label:"Original 151",       items: mk(MAIN, "kanto") },
  { key:"alolan",  label:"Alolan Forms",       items: mk(ALOLAN, "alolan") },
  { key:"eevee",   label:"Eeveelutions",       items: mk(EEVEE, "eevee") },
  { key:"trainer", label:"Trainer's Pok\u00e9mon", items: mk(TRAINER, "trainer") }
];
var ALL = GROUPS.reduce(function(a,g){ return a.concat(g.items); }, []);
var TOTAL = ALL.length;

var STORAGE_KEY = "kantodex_owned_v1";
var MIGRATION_KEY = "kantodex_migrations_v1";
var MIGRATION_ID = "alolan_ethan_v1";
var NEW_OWNED = [10074,10075,10076,20172,20155];

/* ---------- Storage ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function storageWorks(){
  try{ var k="__kd_probe__"; localStorage.setItem(k,"1"); var ok=localStorage.getItem(k)==="1"; localStorage.removeItem(k); return ok; }
  catch(e){ return false; }
}

var storageOk = storageWorks();
var owned;
var filter = "all";
var q = "";

function loadOwned(){
  var set, firstRun = false;
  var raw = lsGet(STORAGE_KEY);
  if(raw){ try{ set = new Set(JSON.parse(raw)); }catch(e){ set = new Set(DEFAULT_OWNED); firstRun = true; } }
  else { set = new Set(DEFAULT_OWNED); firstRun = true; }

  var migrations = [];
  var m = lsGet(MIGRATION_KEY);
  if(m){ try{ migrations = JSON.parse(m); }catch(e){ migrations = []; } }

  var migrated = false;
  if(migrations.indexOf(MIGRATION_ID) === -1){
    NEW_OWNED.forEach(function(d){ set.add(d); });
    migrations.push(MIGRATION_ID);
    migrated = true;
  }
  if(firstRun || migrated){ if(!lsSet(STORAGE_KEY, JSON.stringify(Array.from(set)))) storageOk = false; }
  if(migrated){ lsSet(MIGRATION_KEY, JSON.stringify(migrations)); }
  owned = set;
}

function persist(){ if(!lsSet(STORAGE_KEY, JSON.stringify(Array.from(owned)))) { storageOk = false; renderChrome(); } }

/* ---------- Logic ---------- */
function counts(){
  var have = owned.size;
  var wantLeft = 0;
  WANT.forEach(function(d){ if(!owned.has(d)) wantLeft++; });
  return { all: TOTAL, have: have, need: TOTAL - have, want: wantLeft };
}
function passes(p){
  if(filter==="have" && !owned.has(p.dex)) return false;
  if(filter==="need" && owned.has(p.dex)) return false;
  if(filter==="want" && (owned.has(p.dex) || !WANT.has(p.dex))) return false;
  if(q){
    var num = String(p.no).padStart(3,"0");
    if(p.name.toLowerCase().indexOf(q) === -1 && num.indexOf(q) === -1) return false;
  }
  return true;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function toggle(dex){
  if(owned.has(dex)) owned.delete(dex); else owned.add(dex);
  persist();
  renderChrome();
  renderBody();
}

/* ---------- Render ---------- */
var TABS = [["all","All"],["have","Have"],["need","Need"],["want","Wishlist"]];

function renderTabs(){
  var c = counts();
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    var on = filter===t[0] ? " on" : "";
    return '<button class="kd-tab'+on+'" data-tab="'+t[0]+'">'+t[1]+'<span class="kd-tabnum">'+c[t[0]]+'</span></button>';
  }).join("");
}
function renderChrome(){
  var c = counts();
  var pct = Math.round((c.have / TOTAL) * 100);
  document.getElementById("count").textContent = String(c.have).padStart(3,"0");
  document.getElementById("total").textContent = TOTAL;
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("sub").textContent = c.need + " still to find" + (c.want>0 ? " \u00b7 " + c.want + " on the wishlist" : "");
  document.getElementById("warn").style.display = storageOk ? "none" : "block";
  document.getElementById("foot").textContent = storageOk
    ? "Tap a row to mark a card owned. Progress saves on this device."
    : "Tap a row to mark a card owned. Saving is currently unavailable.";
  document.getElementById("exportHint").textContent = c.have + " owned. Copy this and paste it back to fold into the defaults.";
  document.getElementById("exportBox").value = "[" + Array.from(owned).sort(function(a,b){return a-b;}).join(",") + "]";
  renderTabs();
}
function rowHTML(p){
  var isOwned = owned.has(p.dex);
  var isWant = WANT.has(p.dex);
  return '<li class="kd-row'+(isOwned?" have":"")+'">'
    + '<button class="kd-rowbtn" data-dex="'+p.dex+'" aria-pressed="'+isOwned+'">'
    + '<span class="kd-check'+(isOwned?" on":"")+'" aria-hidden="true">'+(isOwned?"\u2713":"")+'</span>'
    + '<span class="kd-dex">'+String(p.no).padStart(3,"0")+'</span>'
    + '<span class="kd-name">'+esc(p.name)+'</span>'
    + (isWant && !isOwned ? '<span class="kd-want">Wishlist</span>' : '')
    + '</button></li>';
}
function renderBody(){
  var html = "";
  var anyVisible = false;
  GROUPS.forEach(function(g){
    var rows = g.items.filter(passes);
    if(rows.length){
      anyVisible = true;
      html += '<section><div class="kd-sec">'+g.label+'</div><ul class="kd-list">'
        + rows.map(rowHTML).join("") + '</ul></section>';
    }
  });
  if(!anyVisible) html = '<div class="kd-empty">Nothing matches that filter. Try another tab or clear the search.</div>';
  document.getElementById("body").innerHTML = html;
}

/* ---------- Icon (drawn at runtime so the home-screen app has its own) ---------- */
function roundRect(x,x0,y0,w,h,r){ x.beginPath(); x.moveTo(x0+r,y0); x.arcTo(x0+w,y0,x0+w,y0+h,r); x.arcTo(x0+w,y0+h,x0,y0+h,r); x.arcTo(x0,y0+h,x0,y0,r); x.arcTo(x0,y0,x0+w,y0,r); x.closePath(); }
function makeIcon(){
  try{
    var c=document.createElement("canvas"); c.width=180; c.height=180;
    var x=c.getContext("2d");
    x.fillStyle="#211f1a"; roundRect(x,0,0,180,180,40); x.fill();
    x.fillStyle="#c1272d"; x.beginPath(); x.arc(90,98,46,0,Math.PI*2); x.fill();
    x.strokeStyle="#f2efe6"; x.lineWidth=6; x.beginPath(); x.arc(90,98,46,0,Math.PI*2); x.stroke();
    x.fillStyle="#7ec8ff"; x.beginPath(); x.arc(76,84,16,0,Math.PI*2); x.fill();
    var url=c.toDataURL("image/png");
    var l=document.createElement("link"); l.rel="apple-touch-icon"; l.href=url; document.head.appendChild(l);
    var f=document.createElement("link"); f.rel="icon"; f.href=url; document.head.appendChild(f);
  }catch(e){}
}

/* ---------- Wire up ---------- */
document.getElementById("body").addEventListener("click", function(e){
  var btn = e.target.closest("[data-dex]");
  if(btn) toggle(Number(btn.getAttribute("data-dex")));
});
document.getElementById("tabs").addEventListener("click", function(e){
  var btn = e.target.closest("[data-tab]");
  if(btn){ filter = btn.getAttribute("data-tab"); renderChrome(); renderBody(); }
});
document.getElementById("search").addEventListener("input", function(e){
  q = e.target.value.trim().toLowerCase();
  renderBody();
});
document.getElementById("exportToggle").addEventListener("click", function(){
  var panel = document.getElementById("exportPanel");
  var open = panel.style.display !== "none";
  panel.style.display = open ? "none" : "block";
  this.textContent = open ? "Export owned list" : "Hide export";
});
document.getElementById("exportBox").addEventListener("focus", function(){ this.select(); });
document.getElementById("copyBtn").addEventListener("click", function(){
  var box = document.getElementById("exportBox");
  var btn = this;
  var done = function(){ btn.textContent = "Copied \u2713"; setTimeout(function(){ btn.textContent = "Copy to clipboard"; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(box.value).then(done).catch(function(){ box.focus(); box.select(); });
  } else { box.focus(); box.select(); }
});

makeIcon();
loadOwned();
renderChrome();
renderBody();
</script>
</body>
</html>
